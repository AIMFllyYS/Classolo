name: Bug
description: 缺陷
title: "[fix] "
labels: ["bug"]
body:
  - type: checkboxes
    id: skills
    attributes:
      label: Skills
      options:
        - label: 已查阅 `docs/skills-registry.md`（复杂拆解须 `/claude:issue-creator`）
          required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现
